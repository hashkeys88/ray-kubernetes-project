apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-worker
  namespace: ray-system
  labels:
    app: ray-worker
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ray-worker
  template:
    metadata:
      labels:
        app: ray-worker
        component: worker
    spec:
      containers:
      - name: ray-worker
        image: rayproject/ray:latest
        command: ["ray", "start", "--address=ray-head-service:6379", "--num-cpus=2", "--memory=2000000000", "--object-manager-port=8076", "--node-manager-port=8077", "--min-worker-port=10002", "--max-worker-port=19999", "--block"]
        resources:
          requests:
            memory: "1Gi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "2"
        env:
        - name: RAY_DISABLE_IMPORT_WARNING
          value: "1"
        volumeMounts:
        - name: ray-logs
          mountPath: /tmp/ray
        - name: ray-data
          mountPath: /tmp/ray_data
      volumes:
      - name: ray-logs
        emptyDir: {}
      - name: ray-data
        persistentVolumeClaim:
          claimName: ray-data-pvc
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ray-worker-hpa
  namespace: ray-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ray-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
