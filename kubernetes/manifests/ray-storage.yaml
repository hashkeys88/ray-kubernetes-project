apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ray-data-pvc
  namespace: ray-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-config
  namespace: ray-system
data:
  ray.conf: |
    # Ray cluster configuration
    ray:
      runtime_env:
        working_dir: /tmp/ray_data
        pip:
          - torch==2.0.1
          - torchvision==0.15.2
          - numpy==1.24.3
          - pandas==2.0.3
          - scikit-learn==1.3.0
          - ray[tune]==2.8.0
          - ray[serve]==2.8.0
      logging:
        level: INFO
        format: "%(asctime)s %(levelname)s %(filename)s:%(lineno)d - %(message)s"
      object_store_memory: 2000000000
      num_cpus: 2
      num_gpus: 0
