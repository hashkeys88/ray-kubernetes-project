apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  namespace: ray-system
  labels:
    app: ray-head
    component: head
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
        component: head
    spec:
      containers:
      - name: ray-head
        image: rayproject/ray:latest
        ports:
        - containerPort: 6379
          name: gcs-server
        - containerPort: 8265
          name: dashboard
        - containerPort: 10001
          name: client
        - containerPort: 8000
          name: serve
        command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--dashboard-port=8265", "--num-cpus=2", "--memory=4000000000", "--min-worker-port=10002", "--max-worker-port=19999", "--block"]
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        env:
        - name: RAY_DISABLE_IMPORT_WARNING
          value: "1"
        volumeMounts:
        - name: ray-logs
          mountPath: /tmp/ray
        - name: ray-data
          mountPath: /tmp/ray_data
      volumes:
      - name: ray-logs
        emptyDir: {}
      - name: ray-data
        persistentVolumeClaim:
          claimName: ray-data-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head-service
  namespace: ray-system
  labels:
    app: ray-head
spec:
  selector:
    app: ray-head
  ports:
  - name: gcs-server
    port: 6379
    targetPort: 6379
  - name: dashboard
    port: 8265
    targetPort: 8265
  - name: client
    port: 10001
    targetPort: 10001
  - name: serve
    port: 8000
    targetPort: 8000
  type: ClusterIP
