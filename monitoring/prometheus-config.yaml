apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ray-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "ray_rules.yml"
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'ray-head'
        static_configs:
          - targets: ['ray-head-service:8265']
        metrics_path: '/api/metrics'
        scrape_interval: 10s
      
      - job_name: 'ray-workers'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ray-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: worker
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: '${1}:8265'
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

  ray_rules.yml: |
    groups:
      - name: ray.rules
        rules:
          - alert: RayHeadDown
            expr: up{job="ray-head"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Ray head node is down"
              description: "Ray head node has been down for more than 1 minute"
          
          - alert: RayWorkerDown
            expr: up{job="ray-workers"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Ray worker node is down"
              description: "Ray worker node has been down for more than 2 minutes"
          
          - alert: HighMemoryUsage
            expr: (ray_node_mem_used_bytes / ray_node_mem_total_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on Ray node"
              description: "Memory usage is above 90% for more than 5 minutes"
          
          - alert: HighCPUUsage
            expr: (ray_node_cpu_usage_percent / 100) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on Ray node"
              description: "CPU usage is above 90% for more than 5 minutes"
